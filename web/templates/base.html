<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <meta
        name="description"
        content="Tournois, brackets et profils officiels Hamtaro."
    >
    <title>{% block title %}Hamtaro Tournaments{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/app.js" defer></script>
</head>

<body>
    <section class="owner-banner" aria-label="JJET Games">
        <a
            class="owner-banner-image-link"
            href="{{ social_links.youtube }}"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Ouvrir la chaîne YouTube JJET Games"
        >
            <img
                class="owner-banner-image"
                src="/static/jjetgames-banner.png"
                alt="Bannière officielle JJET Games"
            >
        </a>

        <nav class="owner-socials" aria-label="Réseaux sociaux de JJET Games">
            <a
                class="owner-social owner-social-youtube"
                href="{{ social_links.youtube }}"
                target="_blank"
                rel="noopener noreferrer"
            >
                <span class="social-symbol">▶</span>
                <span>YouTube</span>
            </a>

            <a
                class="owner-social owner-social-twitch"
                href="{{ social_links.twitch }}"
                target="_blank"
                rel="noopener noreferrer"
            >
                <span class="social-symbol">▣</span>
                <span>Twitch</span>
            </a>

            <a
                class="owner-social owner-social-discord"
                href="{{ social_links.discord }}"
                target="_blank"
                rel="noopener noreferrer"
            >
                <span class="social-symbol">☁</span>
                <span>Discord</span>
            </a>

            <a
                class="owner-social owner-social-x"
                href="{{ social_links.x }}"
                target="_blank"
                rel="noopener noreferrer"
            >
                <span class="social-symbol">X</span>
                <span>Twitter / X</span>
            </a>

            <a
                class="owner-social owner-social-instagram"
                href="{{ social_links.instagram }}"
                target="_blank"
                rel="noopener noreferrer"
            >
                <span class="social-symbol">◎</span>
                <span>Instagram</span>
            </a>
        </nav>
    </section>

    <header class="site-header">
        <a class="brand" href="/">
            <span class="brand-mark">H</span>
            <span>
                <strong>HAMTARO</strong>
                <small>TOURNAMENTS</small>
            </span>
        </a>

        <nav class="main-navigation" aria-label="Navigation principale">
            <a href="/">Tournois</a>
            <a href="/profiles">Profils</a>
            <a href="/results">Résultats</a>
            <a href="/decks">Decks</a>
            <a href="/archives">Archives</a>
        </nav>
    </header>

    <main class="page-shell">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>Hamtaro Tournament System</p>
        <p>
            Site de tournois du serveur de JJET Games ·
            statistiques issues des résultats validés.
        </p>
    </footer>
</body>
</html>
