{% extends "base.html" %}

{% block title %}Erreur {{ status }} · Hamtaro{% endblock %}

{% block content %}
<section class="hx-error-page">
    <div class="hx-error-mascot" aria-hidden="true">🐹</div>
    <span class="hx-error-code">{{ status }}</span>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <div class="hx-hero-actions">
        <a class="hx-button" href="{{ action_url or '/' }}">
            {{ action_label or "Retour à l'accueil" }}
        </a>
        <button
            class="hx-button hx-button-secondary"
            type="button"
            onclick="window.history.back()"
        >
            Page précédente
        </button>
    </div>
</section>
{% endblock %}
